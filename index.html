<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of tools and projects by itGourmand.">
    <title>itGourmand — Projects</title>

    <link rel="icon" type="image/png" href="https://github.com/itgourmand.png?size=64">
    <link rel="apple-touch-icon" href="https://github.com/itgourmand.png?size=180">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="brand-wrapper">
                <div class="profile-avatar">
                    <img id="profile-avatar" alt="itGourmand's GitHub profile picture">
                    <span id="avatar-fallback" class="avatar-fallback" hidden>itG</span>
                </div>
                <h1 class="site-title">itGourmand</h1>
            </div>

            <p class="site-bio">
                I make small tools and experiments around pixel art, translation, and 3D.
            </p>

            <a href="https://github.com/itgourmand" target="_blank" rel="noopener noreferrer" class="btn-secondary">
                View my GitHub profile <span aria-hidden="true">↗</span>
            </a>
        </header>

        <main>
            <section aria-labelledby="projects-title">
                <h2 id="projects-title" class="section-title">Projects</h2>
                <div id="projects-container" class="projects-grid" aria-live="polite" aria-busy="true">
                    <p class="loading-state">Loading projects…</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
